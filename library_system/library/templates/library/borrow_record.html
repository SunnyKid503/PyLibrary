<!DOCTYPE html>
<html>
<head>
    <title>Borrow {{ book.title }}</title>
</head>
<body>
    <h1>Borrow "{{ book.title }}"</h1>

    <form method="post">
        {% csrf_token %}
        <label for="cin">Enter CIN:</label>
        <input type="text" name="cin" required><br><br>

        <label for="returned_at">Return date (optional):</label>
        <input type="datetime-local" name="returned_at"><br><br>

        <button type="submit">Confirm Borrow</button>
    </form>
</body>
</html>
